<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple IoT World - Login & Register</title>
  
  <!-- Prevent FOUC Theme Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 transition-colors duration-300">

  <!-- Background Decorative Gradient Blobs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-sky-500/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Navbar / Header -->
  <header class="relative z-10 w-full backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-microchip text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-600 via-cyan-500 to-sky-500 bg-clip-text text-transparent">
            Simple IoT World
          </span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-950/60 dark:text-blue-400 border border-blue-200 dark:border-blue-900">
            NodeMCU ESP8266
          </span>
        </div>
      </div>

      <!-- Theme Switcher -->
      <div class="flex items-center space-x-3">
        <button id="themeToggleBtn" type="button" aria-label="Toggle Theme" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:text-blue-500 dark:hover:text-blue-400 hover:border-blue-400 transition-all duration-200 shadow-sm">
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">

      <!-- Glassmorphic Auth Card -->
      <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden border border-white/20 dark:border-slate-800">
        
        <!-- Header Banner Accent -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-cyan-500 to-sky-500"></div>

        <!-- Top Title & Subtitle -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-600 text-white shadow-lg shadow-blue-500/30 mb-4 transform hover:scale-105 transition-transform">
            <i class="fa-solid fa-wifi text-2xl"></i>
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
            Welcome to <span class="bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">Simple IoT World</span>
          </h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
            Control ESP8266, LCD & Monitor Sensors in Real-time
          </p>
        </div>

        <!-- Notification / Alert Message Box -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300 flex items-center space-x-3">
          <i id="alertIcon" class="fa-solid fa-circle-info text-lg"></i>
          <span id="alertMessage"></span>
        </div>

        <!-- Tab Switches (Login vs Register) -->
        <div class="flex p-1 bg-slate-100 dark:bg-slate-800/80 rounded-2xl mb-6 border border-slate-200/60 dark:border-slate-700/60">
          <button id="tabLoginBtn" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-white bg-gradient-to-r from-blue-600 to-cyan-600 shadow-md">
            <i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In
          </button>
          <button id="tabRegisterBtn" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-blue-500 dark:hover:text-blue-400">
            <i class="fa-solid fa-user-plus mr-2"></i>Register
          </button>
        </div>

        <!-- ================= LOGIN FORM ================= -->
        <form id="loginForm" class="space-y-5">
          <div>
            <label for="loginEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
              Email Address
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" id="loginEmail" required placeholder="pranav@example.com"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="loginPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                Password
              </label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" id="loginPassword" required placeholder="••••••••"
                class="w-full pl-10 pr-10 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
              <button type="button" class="toggle-password-visibility absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" data-target="loginPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="loginSubmitBtn"
            class="w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm tracking-wide gradient-btn shadow-lg shadow-blue-500/30 flex items-center justify-center space-x-2">
            <span>Sign In to Dashboard</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </form>

        <!-- ================= REGISTRATION FORM ================= -->
        <form id="registerForm" class="space-y-5 hidden">
          <div>
            <label for="regName" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
              Full Name
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-user"></i>
              </div>
              <input type="text" id="regName" required placeholder="Pranav"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
            </div>
          </div>

          <div>
            <label for="regEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
              Email Address
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" id="regEmail" required placeholder="pranav@example.com"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
            </div>
          </div>

          <div>
            <label for="regPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
              Password (Min 6 Characters)
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" id="regPassword" minlength="6" required placeholder="••••••••"
                class="w-full pl-10 pr-10 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium">
              <button type="button" class="toggle-password-visibility absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" data-target="regPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="regSubmitBtn"
            class="w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm tracking-wide gradient-btn shadow-lg shadow-blue-500/30 flex items-center justify-center space-x-2">
            <span>Create Free Account</span>
            <i class="fa-solid fa-user-check text-xs"></i>
          </button>
        </form>

        <!-- Quick Demo Account Hint -->
        <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-500 dark:text-slate-400">
            First time? Fill in your name, email and password to instantly register and access the dashboard!
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 w-full py-6 border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md text-center transition-colors">
    <div class="max-w-7xl mx-auto px-4">
      <p class="text-sm font-medium text-slate-700 dark:text-slate-300 flex items-center justify-center flex-wrap gap-1.5">
        <span>Developed with</span>
        <span class="heart-pulse text-blue-500 text-base">❤️</span>
        <span>by <strong class="text-blue-600 dark:text-blue-400 font-semibold">Pranav and Team</strong>.</span>
      </p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-normal tracking-wide">
        Department of ETC, SB Jain, Nagpur
      </p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
